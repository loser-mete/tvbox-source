name: 每日更新 TVBox 源

on:
  # 定时更新已迁移到 WorkBuddy 定时任务（每 3 天北京时间 08:00）
  # 这里不再设置 schedule，避免与 WorkBuddy 任务双重提交冲突
  # 允许手动点击触发
  workflow_dispatch:
  # 候选清单变更时也触发一次
  push:
    paths:
      - 'sources.json'
      - 'update.py'

# 授予 workflow 写入仓库内容的权限（用于提交更新后的文件）
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行更新脚本
        run: python update.py

      - name: 生成精选配置
        run: python build_myfav.py

      - name: 提交更新结果
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config.json all.m3u all.txt health.json state.json history/ fongmi.json myfav.json
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
          else
            git commit -m "chore: 自动更新源 [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
          fi
